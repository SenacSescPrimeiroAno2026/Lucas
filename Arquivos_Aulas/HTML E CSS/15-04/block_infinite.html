<body>
    <div class="div_pai">
        <h1>Block e Inline</h1>
        <p>Um elemento de bloco começa em uma linha nova</p>
        <p>Outro elemento em bloco</p>
        <span>Um elemento inline não começa em uma linha nova e so começa o espaço para seu conteudo</span>
        <span>Outro elemento inline</span>
        <br>
        <br>
        <span>Home</span>
        <span>Perfil</span>
        <span>Configurações</span>
        <p>Home</p>
        <p style="display: inline;">Perfil</p>
        <p style="display: inline;">Configurações</p>
        <div class="div1">
            <p>Minha primeira div</p>
        </div>
        <div class="div2">
            <p>Segunda Div</p>
        </div>
        <div class="div3">
            <p>Terceira Div</p>
        </div>
    </div>

</body>
