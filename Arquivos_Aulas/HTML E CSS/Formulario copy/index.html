    <!DOCTYPE html>

    <body>

    <div class="container mt-5" style="max-width: 700px;">
        <h1> Formulários HTML</h1>

    <form>
        <div >
        <div class="form-group">
        <label for="exampleInputname1">Nome Completo</label>
        <br>
        <input type="Nome" class="form-control" id="exampleInputname1" placeholder="Name">
        </div>
        <br>
        <br>
        <div class="form-group">
        <label for="exampleInputEmail1">Email address</label>
        <br>
        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Email">
        <br>
        </div>
        <BR>

        <div class="form-check">
        <label for="exampleInputage1">Idade</label>
        <br>
        <input type="Nome" class="form-control" id="exampleInputage1" placeholder="Idade">
        </div>
        <br>

        <div class="form-check">
        <label for="exampleInputtelefone1">Telefone</label>
        <br>
        <input type="Nome" class="form-control" id="exampleInputtelefone1" placeholder="Telefone">
        </div>
        
        <div class="form-check">
        <label for="exampleInputesporte">Turno disponivel </label>
        <br>
        <input class="form-check-input" type="radio" name="exampleRadios" id="exampleRadios1" value="option1" checked>
        <label class="form-check-label" for="exampleRadios1">
        Manha
        </label>
        </div>
        <div class="form-check">
        <input class="form-check-input" type="radio" name="exampleRadios" id="exampleRadios2" value="option2">

        Tarde
        </label>
        </div>
        <div class="form-check disabled">
        <input class="form-check-input" type="radio" name="exampleRadios" id="exampleRadios3" value="option3" disabled>
        <label class="form-check-label" for="exampleRadios3">
        Noite(Esgotado)
        </label>
        </div>

        <br>
        <div class="form-check form-check-inline">
        <label for="exampleInputesporte">Escolha seus interesses </label>
        <br>
        <input class="form-check-input" type="checkbox" id="inlineCheckbox1" value="option1">
        <label class="form-check-label" for="inlineCheckbox1">Tecnologia</label>
        </div>
        <br>

        <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="inlineCheckbox2" value="option2">
        <label class="form-check-label" for="inlineCheckbox2">Esporte</label>
        </div>
        <br>

        <div class="form-check form-check-inline">

        </div>
        <br>
        
            <div class="form-check form-check-inline">

        </div>
        <br>
        <button type="submit" class="btn btn-primary">Submit</button>

        </div>
        
    </form>
