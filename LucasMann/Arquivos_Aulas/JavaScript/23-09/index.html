<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 23-09</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Perfil Interativo</h1>
    
    <div class="formulario">
        <h2>Editar Perfil</h2>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite seu nome">
        
        <label for="profissao">Profissão:</label>
        <input type="text" id="profissao" placeholder="Digite sua profissão">
        
        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" placeholder="Digite sua cidade">
        
        <label for="descricao">Descrição:</label>
        <textarea id="descricao" placeholder="Digite uma descrição"></textarea>
        
        <button id="atualizar">Atualizar perfil</button>
    </div>

    <div class="perfil">
        <h2 class="nomePerfil">Nome do usuário</h2>
        <p class="profissaoPerfil">Profissão</p>
        <p class="cidadePerfil">Cidade</p>
        <p class="descricaoPerfil">Descrição do Perfil</p>
    </div> 

    <script src="script.js"></script>
</body>
</html>
